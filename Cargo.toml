[workspace]
members = ["crates/krevo-core", "apps/desktop/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.4.2"
edition = "2021"
license = "MIT"
authors = ["Krevo Contributors"]
repository = "https://github.com/Pedro21062014/krevo"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
