name: build

# Gera os instaladores de todas as plataformas.
#
# - push em main: roda testes + build e guarda os instaladores como artefatos
# - tag v*: cria um Release no GitHub com .exe, .msi, .deb, .AppImage e .dmg
# - workflow_dispatch: roda na mão quando você quiser

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Necessário para o tauri-action criar o Release e anexar os instaladores.
permissions:
  contents: write

jobs:
  test:
    name: Testes (Rust + TypeScript)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      # O núcleo (krevo-core) é Rust puro e não depende de GTK/WebKit:
      # os testes rodam em segundos, sem instalar bibliotecas de sistema.
      # O crate do app (krevo) é compilado nos jobs de bundle.
      - name: Testar o núcleo
        run: cargo test -p krevo-core --all-features --verbose
      - name: Gerar PDF de exemplo (prova do motor vetorial)
        run: cargo run -p krevo-core --example export_demo -- target/demo.pdf
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Alvos do macOS (binário universal)
        if: matrix.os == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Instalar dependências da interface
        working-directory: apps/desktop
        run: npm ci
      - name: Checar tipos e buildar a interface
        working-directory: apps/desktop
        run: npm run build
      - name: Testar importação com backend de vídeo bloqueado (WebKit Linux)
        working-directory: apps/desktop
        env:
          TEST_BROWSER: webkit
        run: |
          npx playwright install --with-deps webkit
          npm run dev -- --port 5173 > /tmp/krevo-vite.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          node tests/video-import.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: krevo-pdf-demo
          path: target/demo.pdf
          if-no-files-found: warn

  bundle:
    name: Instaladores · ${{ matrix.label }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows (x64)
            os: windows-latest
            args: "--bundles nsis,msi"
            artifact: krevo-windows
          - label: "macOS (universal)"
            os: macos-latest
            args: "--target universal-apple-darwin --bundles dmg,app"
            artifact: krevo-macos-universal
          - label: Linux (x64)
            os: ubuntu-22.04
            args: "--bundles deb,appimage"
            artifact: krevo-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: ${{ matrix.artifact }}

      - name: Instalar dependências do Linux
        if: matrix.os == 'ubuntu-22.04'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get update -qq
          sudo -E apt-get install -y -qq --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev libsoup-3.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav gstreamer1.0-pulseaudio gstreamer1.0-alsa

      - name: Alvos do macOS (binário universal)
        if: matrix.os == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Instalar dependências da interface
        working-directory: apps/desktop
        run: npm ci

      - name: Buildar os instaladores (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          args: ${{ matrix.args }}
          # Em tags, publica o release automaticamente
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('Krevo {0}', github.ref_name) || '' }}
          releaseBody: |
            ## Krevo ${{ github.ref_name }}

            Estúdio de design nativo em Rust com agente de IA: PDF, apresentações, imagens e vídeo.

            | Plataforma | Arquivo |
            |---|---|
            | Windows | `Krevo_*_x64-setup.exe` (NSIS) e `Krevo_*_x64_en-US.msi` |
            | macOS | `Krevo_*_universal.dmg` (Intel + Apple Silicon) |
            | Linux | `Krevo_*_amd64.deb` e `Krevo_*_amd64.AppImage` |

            > Os builds não são assinados. No macOS, clique com o botão direito → Abrir na primeira execução.
            > No Windows, se o SmartScreen aparecer, escolha "Mais informações" → "Executar assim mesmo".
          releaseDraft: false
          prerelease: false

      - name: Verificar plugins de mídia dentro do AppImage
        if: matrix.os == 'ubuntu-22.04'
        run: python3 scripts/verify_appimage_media.py target/release/bundle/appimage/*.AppImage

      - name: Guardar os instaladores como artefatos
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/dmg/*.dmg
          if-no-files-found: warn
          retention-days: 30
